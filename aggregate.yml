name: '@miorin/dsh-atlas-list'
version: 0.1.0
description: 'Switch sidebar list views, mark drafts, keep watched sessions visible, and see active jobs across sessions.'
license: MIT
engines:
  dsh: '0.2.2-rc.5'
plugins:
  - name: '@miorin/dsh-workspace-list-toggle'
    spec: 0.1.0
  - name: '@miorin/dsh-session-draft'
    spec: 0.1.0
  - name: '@miorin/dsh-watched-sessions'
    spec: link:../dsh-watched-sessions
  - name: '@miorin/dsh-background-jobs-sidebar'
    spec: 0.1.0
